<text x="136" y="166" font-size="15" fill="#E8E5D8">kanta &#8212; LLM application engineer (Python &#215; TypeScript)</text>
<text x="72" y="222" font-size="14" fill="#FBBF24" font-weight="700">SYNOPSIS</text>
<text x="136" y="258" font-size="15" fill="#E8E5D8">kanta [--llm] [--backend] [--frontend] &lt;business-problem&gt;</text>
<text x="72" y="314" font-size="14" fill="#FBBF24" font-weight="700">DESCRIPTION</text>
<text x="136" y="350" font-size="15" fill="#9A9483">生成AIを実務で使えるプロダクトに落とし込むことを専門とする。</text>
<text x="136" y="378" font-size="15" fill="#9A9483">プロンプト設計・精度評価から、それを前提としたUX設計・実装までを一貫して行う。</text>
<text x="72" y="434" font-size="14" fill="#FBBF24" font-weight="700">WORKS</text>
<text x="136" y="472" font-size="15" fill="#FDE68A">doc-extract-agent</text>
<text x="200" y="504" font-size="14" fill="#9A9483">契約書PDFから条項を構造化抽出するLLMエージェント。</text>
<text x="200" y="530" font-size="14" fill="#6E6A5A">抽出精度 92% / 個人開発 / Python, GPT</text>
<text x="200" y="556" font-size="14" fill="#60A5FA">&#8594; README</text><text x="330" y="556" font-size="14" fill="#60A5FA">&#8594; Demo</text>
